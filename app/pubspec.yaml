name: carebridge
description: CareBridge — patient-owned, multi-clinic health-record platform (Flutter + Supabase).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Routing — role-based routing from the three-button entry screen (Section 2/3).
  go_router: ^14.2.0
  # State management (approved pick).
  flutter_riverpod: ^2.5.1
  # Backend client.
  supabase_flutter: ^2.5.6
  # Env flags (REQUIRE_ABHA etc.) loaded from .env — never commit the real file.
  flutter_dotenv: ^5.1.0
  speech_to_text: ^7.4.0
  file_picker: ^11.0.2
  # Phase 11 (D12, founder decision 2026-07-06): OTP is Supabase-hosted with a
  # pluggable SMS sender (MSG91 first) — no Firebase client needed.
  # Opens the official ABHA creation page (D3: ABHA optional in pilot).
  url_launcher: ^6.3.0
  # Persists the dark-mode override across app restarts (UI brief §2).
  shared_preferences: ^2.3.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.3
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # The running app reads real client config from .env (gitignored). It holds
    # ONLY client-safe values: SUPABASE_URL + SUPABASE_ANON_KEY. Server-only
    # secrets (service_role, JWT, Claude, FCM) live in the ROOT .env and are
    # never bundled into the client. `.env` must exist to build — copy from
    # .env.example. The committed .env.example stays as a reference/fallback.
    - .env
    - .env.example
    # Bundled font files (security review M6): with runtime fetching disabled in
    # main(), google_fonts loads these from the bundle instead of fetching from
    # fonts.gstatic.com at startup. Filenames must match the family+weight names
    # google_fonts expects (Figtree Regular/Medium/SemiBold/Bold/ExtraBold, Noto
    # Sans Regular/Medium/Bold). Add the matching weight file before using a new one.
    - assets/google_fonts/
