name: carebridge
description: CareBridge — patient-owned, multi-clinic health-record platform (Flutter + Supabase).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Routing — role-based routing from the three-button entry screen (Section 2/3).
  go_router: ^14.2.0
  # State management (approved pick).
  flutter_riverpod: ^2.5.1
  # Backend client.
  supabase_flutter: ^2.5.6
  # Env flags (REQUIRE_ABHA etc.) loaded from .env — never commit the real file.
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
    # NOTE: .env is intentionally NOT listed here and is gitignored.
