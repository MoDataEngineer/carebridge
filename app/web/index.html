<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!--
    L4 (security review 2026-07-19): baseline client-side hardening.
    - Content-Security-Policy limits where scripts/styles/data may load from and
      forbids this app being framed (clickjacking). connect-src allows Supabase
      (REST/Realtime/Storage/Edge Functions) over https + wss only.
      'wasm-unsafe-eval' is required by Flutter's CanvasKit renderer.
    NOTE: HSTS, X-Frame-Options and X-Content-Type-Options are HTTP RESPONSE
    headers and cannot be set via <meta> — configure them at the hosting/CDN
    layer at deploy time (see docs/SECURITY_REVIEW_2026-07-19.md, L4).
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    font-src 'self';
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in;
    frame-ancestors 'none';
    base-uri 'self';
    object-src 'none'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="carebridge">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>carebridge</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
