# Supabase local config (Phase 1 scaffold).
# `supabase init` will expand this; key sections are pinned here for clarity.
project_id = "carebridge"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Phase 1 uses placeholder auth; real ABDM/OTP wiring lands in later phases.

[functions.ai-summary]
verify_jwt = true

[functions.notifications]
verify_jwt = true

[functions.mint-scope-token]
verify_jwt = true

# ABDM sandbox onboarding (Phase 11b). Holds the bridge credentials as secrets;
# a valid JWT is required to invoke. Before production, gate its actions to an
# admin/founder session — sandbox onboarding is a one-time setup operation.
[functions.abdm-gateway]
verify_jwt = true

# The HTTPS host ABDM's gateway calls back on. PUBLIC — ABDM has no Supabase JWT.
[functions.abdm-callback]
verify_jwt = false
